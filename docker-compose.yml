services:
  monster-race:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: monster_race_app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATA_DIR=/app/data
      - TZ=America/Mexico_City
    volumes:
      # Persistent host directory for data/monsters.json
      - ./data:/app/data
